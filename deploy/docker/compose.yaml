name: oldtown

services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      OT_TRUSTED_PROXY: 172.31.78.2
    volumes:
      - relay-data:/var/lib/ot-relay
    ports:
      - "127.0.0.1:${OT_ADMIN_PORT:-7879}:7879"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      oldtown:
        ipv4_address: 172.31.78.3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [relay]
    environment:
      OT_DOMAIN: ${OT_DOMAIN:?OT_DOMAIN manquant, voir deploy/docker/.env}
      OT_UPSTREAM: relay:7878
    ports:
      - "${OT_HTTP_PORT:-80}:80"
      - "${OT_HTTPS_PORT:-443}:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks:
      oldtown:
        ipv4_address: 172.31.78.2

networks:
  oldtown:
    ipam:
      config:
        - subnet: 172.31.78.0/24

volumes:
  relay-data:
  caddy-data:
  caddy-config:
