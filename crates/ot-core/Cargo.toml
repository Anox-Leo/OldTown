[package]
name = "ot-core"
description = "Cœur client OldTown : connexion, chiffrement, appairage, reconnexion, dédoublonnage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["net"]
# Connexion au relais (tokio, WebSocket, TLS). Sans elle, le cœur se compile
# en WebAssembly pour l'extension (note 0023).
net = [
    "dep:futures-util",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:webpki-roots",
]

[dependencies]
ot-proto.workspace = true
ot-crypto.workspace = true
ed25519-dalek.workspace = true
futures-util = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
getrandom.workspace = true
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing.workspace = true
webpki-roots = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
