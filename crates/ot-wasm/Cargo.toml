[package]
name = "ot-wasm"
description = "Cœur OldTown sans réseau compilé en WebAssembly pour l'extension Chrome"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Sans la fonction `net` : ni tokio, ni WebSocket, ni TLS (note 0023). Par
# son chemin : hériter du workspace avec `default-features = false` est
# refusé par certaines versions de cargo (dont celle de cargo-deny-action).
ot-core = { path = "../ot-core", default-features = false }
ot-proto.workspace = true
# Aléa par `crypto.getRandomValues` en WebAssembly ; sans effet ailleurs.
getrandom = { workspace = true, features = ["wasm_js"] }
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
# SHA-256 en flux des fichiers (WebCrypto ne hache qu'en une fois).
sha2.workspace = true
# Horloge JavaScript en WebAssembly (`OffsetDateTime::now_utc`).
time = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen.workspace = true
zeroize.workspace = true
