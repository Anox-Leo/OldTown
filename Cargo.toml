[workspace]
resolver = "3"
members = [
    "crates/ot-proto",
    "crates/ot-crypto",
    "crates/ot-core",
    "crates/ot-server",
    "crates/ot-cli",
    "crates/ot-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.dependencies]
ot-proto = { path = "crates/ot-proto" }
ot-crypto = { path = "crates/ot-crypto" }
ot-core = { path = "crates/ot-core" }
ot-server = { path = "crates/ot-server" }
ot-ffi = { path = "crates/ot-ffi" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = { version = "0.4", features = ["std"] }
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
hkdf = "0.13"
# TLS : fournisseur `ring` (compilation croisée Android sans cmake ; note 0022).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "3", features = ["serde"] }
uniffi = "0.32"
webpki-roots = "1"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

# Bibliothèque Android : petite et sans symboles (étape 3, risque « taille de
# l'APK »). Gradle compile avec `--profile android` ; le relais et la CLI
# gardent le profil `release` habituel.
[profile.android]
inherits = "release"
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
