name: Extension

# Extension Chrome (étape 4) : seulement quand l'extension ou le cœur Rust
# change, sous Linux. Construit le WebAssembly, lance lint et tests (dont un
# vrai relais et la CLI), et produit l'extension non empaquetée.
on:
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "apps/extension/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  extension:
    name: Lint, tests et extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: extension
      # Le générateur doit avoir exactement la version de la crate
      # wasm-bindgen du Cargo.lock.
      - name: wasm-bindgen-cli
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install --locked wasm-bindgen-cli --version "$version"
      # Relais et CLI pour le test de bout en bout (test/relay.test.ts).
      - name: ot-server et ot
        run: cargo build --locked -p ot-server -p ot-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: npm ci
        working-directory: apps/extension
        run: npm ci
      - name: Tests
        working-directory: apps/extension
        run: npm test
      - name: Lint
        working-directory: apps/extension
        run: npm run lint
      - name: Build
        working-directory: apps/extension
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oldtown-extension
          path: apps/extension/dist/extension
          retention-days: 14
