version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/extension
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Angular (@angular/build, @angular/compiler-cli) n'accepte encore que
      # TypeScript 6.0 : à retirer quand une version d'Angular accepte la 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Suit la version de Node de la CI (24, workflows extension et release).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
