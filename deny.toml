# cargo deny check : licences, failles connues (RustSec), sources des crates.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml n'est plus maintenue (pas une faille). Tirée seulement par
    # askama, le moteur de gabarits du générateur uniffi_bindgen (option
    # `bindgen` d'ot-ffi), qui s'exécute à la compilation et ne lit que ses
    # propres fichiers de configuration. Aucune version d'uniffi ne s'en passe
    # encore : à retirer dès qu'askama change de parseur (note 0042).
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen/askama; no maintained alternative upstream yet" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    # Permissive, équivalente à MIT : ring, rustls-webpki, untrusted (TLS,
    # étape 3, note 0022).
    "ISC",
]
confidence-threshold = 0.9
# MPL-2.0 (copyleft faible, par fichier) : toléré pour cette dépendance de
# `directories`, que l'on ne modifie pas.
exceptions = [
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # Liste des autorités de Mozilla (données), licence permissive : client
    # `wss` (note 0022).
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # UniFFI (pont Android, étape 3) : MPL-2.0, utilisée sans modification ;
    # le copyleft porte sur ses fichiers seulement (note 0022). uniffi_bindgen
    # et uniffi_udl (générateur, option `bindgen` d'ot-ffi) n'apparaissent
    # qu'avec --all-features, comme dans la CI.
    { crate = "uniffi", allow = ["MPL-2.0"] },
    { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },
    { crate = "uniffi_udl", allow = ["MPL-2.0"] },
    { crate = "uniffi_core", allow = ["MPL-2.0"] },
    { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_meta", allow = ["MPL-2.0"] },
    { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
