# cargo deny check : licences, failles connues (RustSec), sources des crates.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# MPL-2.0 (copyleft faible, par fichier) : toléré pour cette dépendance de
# `directories`, que l'on ne modifie pas.
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
