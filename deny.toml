[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen/askama; no maintained alternative upstream yet" },
    { id = "RUSTSEC-2026-0459", reason = "relay only opens its own database; sqlx 0.9.0 pins libsqlite3-sys < 0.38, no fixed version reachable yet" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "ISC",
]
confidence-threshold = 0.9
exceptions = [
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "uniffi", allow = ["MPL-2.0"] },
    { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },
    { crate = "uniffi_udl", allow = ["MPL-2.0"] },
    { crate = "uniffi_core", allow = ["MPL-2.0"] },
    { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_macros", allow = ["MPL-2.0"] },
    { crate = "uniffi_meta", allow = ["MPL-2.0"] },
    { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
